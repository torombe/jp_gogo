<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 Kansai Vibe Trip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        
        .font-header {
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        /* Ambient Background Animation */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(76, 29, 149, 0.2), rgba(15, 23, 42, 1));
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #4f46e5; animation-delay: 0s; }
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #db2777; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 40%; width: 400px; height: 400px; background: #0ea5e9; animation-delay: -2s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        /* Map Button Vibe */
        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.2s;
            text-decoration: none;
        }

        .map-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            color: #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Timeline Line */
        .timeline-line {
            position: absolute;
            left: 24px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, #6366f1, #ec4899, transparent);
            z-index: 0;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="itineraryApp()">

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="max-w-3xl mx-auto px-4 py-12 relative z-10 min-h-screen flex flex-col">
        
        <header class="text-center mb-12 animate-fade-in-down">
            <span class="inline-block px-3 py-1 mb-4 rounded-full bg-white/5 border border-white/10 text-xs tracking-[0.2em] text-cyan-300 uppercase">
                Travel Itinerary
            </span>
            <h1 class="text-5xl md:text-6xl font-black font-header mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-blue-400 to-purple-400 drop-shadow-lg">
                KANSAI 2025
            </h1>
            <p class="text-slate-400 text-lg tracking-wide">大阪梅田 · 萬博公園 · 神戶港灣</p>
        </header>

        <nav class="flex justify-center mb-10 sticky top-4 z-50">
            <div class="bg-slate-900/80 backdrop-blur-md p-1.5 rounded-full border border-white/10 shadow-2xl flex gap-1">
                <template x-for="(day, index) in days" :key="index">
                    <button 
                        @click="currentDay = index"
                        class="px-6 py-2 rounded-full text-sm font-bold transition-all duration-300 font-header"
                        :class="currentDay === index ? 'bg-gradient-to-r from-blue-600 to-purple-600 text-white shadow-lg scale-105' : 'text-slate-400 hover:text-white hover:bg-white/5'"
                        x-text="day.shortTitle">
                    </button>
                </template>
            </div>
        </nav>

        <div class="relative flex-grow">
            <div class="timeline-line hidden md:block md:left-8"></div>

            <template x-for="(day, dayIndex) in days" :key="dayIndex">
                <div x-show="currentDay === dayIndex" 
                     x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="opacity-0 translate-y-4"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="space-y-6">
                    
                    <div class="md:pl-20 mb-8 text-center md:text-left">
                        <h2 class="text-3xl font-bold font-header text-white flex items-center justify-center md:justify-start gap-3">
                            <span class="text-4xl" x-text="day.icon"></span>
                            <span x-text="day.date"></span>
                        </h2>
                        <p class="text-purple-300 font-medium text-lg mt-1" x-text="day.title"></p>
                    </div>

                    <template x-for="(event, eventIndex) in day.events" :key="eventIndex">
                        <div class="relative md:pl-20 group">
                            <div class="hidden md:flex absolute left-[24px] top-6 w-4 h-4 rounded-full border-2 border-slate-900 bg-purple-500 transform -translate-x-1/2 z-10 shadow-[0_0_10px_#a855f7] transition-all group-hover:scale-125 group-hover:bg-cyan-400"></div>

                            <div class="glass-card rounded-2xl p-6 relative overflow-hidden">
                                <div class="absolute -right-10 -top-10 w-32 h-32 bg-purple-500/10 rounded-full blur-3xl group-hover:bg-cyan-500/20 transition-colors"></div>

                                <div class="flex flex-col md:flex-row md:items-start gap-4 relative z-10">
                                    <div class="min-w-[70px] pt-1">
                                        <span class="text-cyan-300 font-mono text-xl font-bold" x-text="event.time"></span>
                                    </div>

                                    <div class="flex-grow">
                                        <h3 class="text-xl font-bold text-white mb-2" x-text="event.activity"></h3>
                                        
                                        <div class="space-y-3">
                                            
                                            <p x-show="event.desc" class="text-slate-300 text-sm leading-relaxed" x-text="event.desc"></p>

                                            <template x-if="event.location">
                                                <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(event.locationQuery || event.location)" 
                                                   target="_blank" class="map-btn group-hover:bg-cyan-500/20 group-hover:text-cyan-200">
                                                    <i class="fas fa-location-dot"></i>
                                                    <span x-text="event.location"></span>
                                                </a>
                                            </template>

                                            <template x-if="event.shops">
                                                <div class="flex flex-wrap gap-2 mt-3">
                                                    <template x-for="shop in event.shops">
                                                        <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(shop.query)" 
                                                           target="_blank" 
                                                           class="map-btn border-purple-500/30 text-purple-300 bg-purple-500/10 hover:bg-purple-500/30 hover:text-white">
                                                            <i class="fas fa-bag-shopping"></i>
                                                            <span x-text="shop.name"></span>
                                                        </a>
                                                    </template>
                                                </div>
                                            </template>

                                            <template x-if="event.food">
                                                <div class="mt-2 text-yellow-200/90 text-sm flex items-center gap-2 bg-yellow-500/10 p-2 rounded-lg inline-block">
                                                    <i class="fas fa-utensils"></i>
                                                    <span x-text="event.food"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>

        <footer class="text-center py-10 mt-10 text-slate-500 text-xs tracking-widest uppercase">
            Have a nice trip in Japan
        </footer>
    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('itineraryApp', () => ({
                currentDay: 0,
                days: [
                    {
                        date: '2/3 (Tue)',
                        shortTitle: 'Day 1 梅田',
                        title: '梅田都會與萬博公園',
                        icon: '🌞',
                        events: [
                            { 
                                time: '10:00', 
                                activity: '旅館會合、寄放行李', 
                                location: '阪急大阪龍仕柏飯店',
                                locationQuery: 'Hotel Hankyu RESPIRE OSAKA' 
                            },
                            { 
                                time: '11:00', 
                                activity: '萬博公園 & EXPOCITY', 
                                desc: '逛展館、LaLaport EXPOCITY逛街、午餐',
                                shops: [
                                    { name: '萬博公園', query: 'Expo \'70 Commemorative Park' },
                                    { name: 'LaLaport EXPOCITY', query: 'LaLaport EXPOCITY' }
                                ]
                            },
                            {
